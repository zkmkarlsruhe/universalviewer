name: Release fork tarball

on:
  push:
    tags: ['v*-de.*']

permissions:
  contents: write  # gh release create / upload

jobs:
  pack:
    runs-on: ubuntu-latest
    name: Pack and release tarball
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci

      # Do not rely on prepublishOnly: `npm pack` does not reliably run it here,
      # and dist/ is gitignored (never in the source tree). An unbuilt dist then
      # produces a boilerplate-only tarball (~5 kB, no dist/) — exactly the 5346-byte
      # artifact that broke the first release. Build explicitly, then pack with
      # scripts ignored so we ship exactly what was built.
      - name: Build release artifacts
        run: npm run build-all

      - name: Pack tarball
        run: npm pack --ignore-scripts

      - name: Sanity-check tarball (dist/, de-DE, size)
        run: |
          pkg=$(ls universalviewer-*.tgz | head -1)
          size=$(stat -c%s "$pkg")
          echo "tarball: $pkg ($size bytes)"
          [ "$size" -gt 1000000 ] || { echo "ERROR: tarball suspiciously small ($size bytes)"; exit 1; }
          tar -tzf "$pkg" | grep -q 'package/dist/esm/index.css' \
            || { echo "ERROR: dist/esm/index.css missing"; exit 1; }
          tar -tzf "$pkg" | grep -q 'package/dist/esm/de-DE' \
            || { echo "ERROR: de-DE ESM chunk missing"; exit 1; }
          tar -tzf "$pkg" | grep -q 'package/dist/cjs/locales/de-DE.json' \
            || { echo "ERROR: de-DE CJS locale missing"; exit 1; }
          echo "OK: dist/ and de-DE present"

      - name: Get tag
        id: tagName
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release with tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tagName.outputs.tag }}
        run: |
          pkg=$(ls universalviewer-*.tgz | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing tarball asset."
            gh release upload "$TAG" "$pkg" --clobber
          else
            gh release create "$TAG" "$pkg" \
              --title "$TAG" \
              --notes "Fork release for zkm-data-portal (Option B1 tarball). Download: .../releases/download/$TAG/$pkg"
          fi
